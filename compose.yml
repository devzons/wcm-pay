services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: wcm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WCM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${WCM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${WCM_POSTGRES_DB}
    ports:
      - "127.0.0.1:${WCM_POSTGRES_PORT}:5432"
    volumes:
      - wcm-postgres-data:/var/lib/postgresql

volumes:
  wcm-postgres-data:
    name: wcm-postgres-data
